{% load site_images %}{% load static %}<div class="room-grid">{% for room in rooms %}<a class="room-card" href="{% url 'rooms' %}#room-{{ forloop.counter }}"><div class="room-art art-{{ forloop.counter }}">{% if room.photo %}<img src="{{ room.photo.url }}" alt="{{ room.name }}" loading="lazy">{% elif forloop.counter == 1 %}<img src="{% site_image 'studio/room-twin-illustration.png' %}" alt="Twin bedroom illustration" loading="lazy">{% elif forloop.counter == 2 %}<img src="{% site_image 'studio/room-shared-illustration.png' %}" alt="Shared bedroom illustration" loading="lazy">{% else %}<img src="{% site_image 'studio/room-dorm-illustration.png' %}" alt="Dorm illustration" loading="lazy">{% endif %}</div><div class="room-caption"><h3>{{ room.name }}</h3><span>↗</span></div><p>{{ room.description }}</p></a>{% endfor %}</div>
