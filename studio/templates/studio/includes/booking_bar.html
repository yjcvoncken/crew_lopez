<form class="surf-booking" action="{% url 'booking' %}" method="get" aria-label="Search your stay" data-booking-search>
  <label class="booking-field"><span>Check-in</span><span class="booking-control"><input type="date" name="start_date" aria-label="Check-in" required><span class="booking-date-display" aria-hidden="true">Choose date</span><span class="booking-chevron" aria-hidden="true"></span></span></label>
  <label class="booking-field"><span>Check-out</span><span class="booking-control"><input type="date" name="end_date" aria-label="Check-out" required><span class="booking-date-display" aria-hidden="true">Choose date</span><span class="booking-chevron" aria-hidden="true"></span></span></label>
  <label class="booking-field booking-adults"><span>Adults</span><span class="booking-control"><select name="adults" aria-label="Adults">{% for count in '123456789' %}<option value="{{ count }}"{% if count == '2' %} selected{% endif %}>{{ count }}</option>{% endfor %}<option value="10">10</option><option value="11">11</option></select><span class="booking-chevron" aria-hidden="true"></span></span></label>
  <div class="booking-search-action"><button type="submit">Search</button></div>
</form>
