{% load page_text %}<form class="surf-booking" action="{% url 'booking' %}" method="get" aria-label="Search your stay" data-booking-search>
  <label class="booking-field"><span>{% editable_text "booking_bar.001" %}Check-in{% endeditable_text %}</span><span class="booking-control"><input type="date" name="start_date" aria-label="Check-in" required><span class="booking-date-display" aria-hidden="true">{% editable_text "booking_bar.002" %}Choose date</span><span class="booking-chevron" aria-hidden="true"></span>{% endeditable_text %}</span></label>
  <label class="booking-field"><span>{% editable_text "booking_bar.003" %}Check-out{% endeditable_text %}</span><span class="booking-control"><input type="date" name="end_date" aria-label="Check-out" required><span class="booking-date-display" aria-hidden="true">{% editable_text "booking_bar.004" %}Choose date</span><span class="booking-chevron" aria-hidden="true"></span>{% endeditable_text %}</span></label>
  <label class="booking-field booking-adults"><span>{% editable_text "booking_bar.005" %}Adults{% endeditable_text %}</span><span class="booking-control"><select name="adults" aria-label="Adults">{% for count in '123456789' %}<option value="{{ count }}"{% if count == '2' %} selected{% endif %}>{{ count }}</option>{% endfor %}<option value="10">10</option><option value="11">11</option></select><span class="booking-chevron" aria-hidden="true">{% editable_text "booking_bar.006" %}</span>{% endeditable_text %}</span></label>
  <div class="booking-search-action"><button type="submit">{% editable_text "booking_bar.007" %}Search{% endeditable_text %}</button></div>
</form>
