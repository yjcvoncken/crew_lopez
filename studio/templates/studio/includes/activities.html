{% load static %}<div class="activity-grid">{% for activity in activities %}<a class="activity-card" href="{% url 'activities' %}#{{ activity.slug }}">{% if activity.photo %}<img class="activity-photo" src="{{ activity.photo.url }}" alt="{{ activity.name }}" width="900" height="600" loading="lazy" decoding="async">{% elif activity.slug in 'surf,hikes,snorkeling,stargazing,surfskate,skate,four-by-four,kite' %}<img class="activity-photo" src="{% static 'studio/activities/' %}{{ activity.slug }}.jpg" alt="{{ activity.name }} activity inspiration" width="900" height="600" loading="lazy" decoding="async">{% endif %}<div class="activity-card-copy"><span class="activity-icon" aria-hidden="true">{{ activity.icon }}</span><small>0{{ forloop.counter }}</small><h3>{{ activity.name }}</h3><p>{{ activity.short }}</p><span class="activity-arrow">↗</span></div></a>{% endfor %}</div>
