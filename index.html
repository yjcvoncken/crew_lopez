.crew-graphic{height:auto;object-fit:contain;pointer-events:none;user-select:none}
.intro-graphic{width:300px;max-width:90%;margin:18px 0 -20px;transform:rotate(-5deg)}
.flow-graphic{width:160px;margin:-25px 0 8px;filter:invert(1);opacity:.85}
.location-graphic{width:280px;max-width:100%;margin:-15px auto -10px}
.graphic-caption{display:block;font-size:10px;letter-spacing:2px;margin-bottom:14px}
.essentials-art{display:flex;flex-direction:column;align-items:center}
.palm-graphic{width:145px;margin:-25px auto -12px}
.essentials-art h3{margin-top:16px;font-size:23px;line-height:1.6}
.illustrated-hero{position:relative;padding-right:38%;min-height:380px}
.activities-graphic{position:absolute;right:7%;top:30px;width:300px;max-width:30%;transform:rotate(-6deg)}
.footer-top{position:relative;padding-right:90px}
.footer-graphic{position:absolute;right:-10px;bottom:25px;width:100px;opacity:.75}
@media(max-width:800px){.intro-graphic{width:220px;margin:5px 0 -15px}.flow-graphic{width:135px;margin:-10px 0 5px}.illustrated-hero{padding-right:7%}.activities-graphic{position:static;width:220px;max-width:70%;margin:0 auto 15px}.footer-top{padding-right:0}.footer-graphic{display:none}}

/* Photos introduce each experience on the home and activities pages. */
.activity-card{padding:0;overflow:hidden}
.activity-card .activity-photo{width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;margin:0;border-radius:0;flex-shrink:0;transition:transform .4s}
.activity-card-copy{padding:24px 26px;position:relative;display:flex;flex-direction:column;flex:1}
.activity-card-copy .activity-icon{font-size:32px}
.activity-card-copy h3{margin-top:16px}
@media(max-width:480px){.activity-card-copy{padding:20px 16px}.activity-card-copy h3{font-size:20px}.activity-card-copy small{right:14px;top:20px}}
@media(prefers-reduced-motion:reduce){.activity-card .activity-photo{transition:none}}

/* A continuous banner; both groups have identical widths for a seamless loop. */
.ticker{display:block;overflow:hidden;white-space:nowrap;padding:22px 0;text-align:left}
.ticker-track{display:flex;width:max-content;animation:crew-banner-scroll 26s linear infinite}
.ticker-group{display:flex;align-items:center;justify-content:space-around;gap:32px;padding:0 16px;min-width:100vw;box-sizing:border-box;flex-shrink:0}
.ticker span{flex-shrink:0;font-size:13px;line-height:1.6;letter-spacing:1.2px}
.ticker-star{display:block;width:20px;height:20px;flex-shrink:0;color:#bd984c}
.ticker:hover .ticker-track,.ticker:focus .ticker-track{animation-play-state:paused}
@keyframes crew-banner-scroll{to{transform:translateX(-50%)}}
@media(max-width:800px){.ticker{padding:20px 0}.ticker-group{gap:26px;padding:0 13px}.ticker span{font-size:12px;letter-spacing:1px}.ticker-star{width:18px;height:18px}}
@media(prefers-reduced-motion:reduce){
 .ticker{white-space:normal}
 .ticker-track{animation:none;width:100%}
 .ticker-group{min-width:0;width:100%;flex-wrap:wrap;justify-content:center;gap:12px 20px;padding:0 20px}
 .ticker-group[aria-hidden=true]{display:none}
}

/* On phones, show one complete slogan at a time. */
.ticker-mobile{display:none}
@media(max-width:800px){
 .ticker>.ticker-track{display:none}
 .ticker-mobile{display:block;overflow:hidden;width:100%}
 .ticker-mobile-track{display:flex;width:400%;animation:crew-mobile-carousel 15s infinite}
 .ticker-slide{width:25%;flex-shrink:0;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:18px;padding:0 16px;min-height:24px}
 .ticker-slide span{white-space:nowrap;font-size:12px;letter-spacing:1px}
 .ticker-mobile .ticker-star{width:16px;height:16px}
 .ticker:hover .ticker-mobile-track,.ticker:focus .ticker-mobile-track{animation-play-state:paused}
}
@keyframes crew-mobile-carousel{
 0%,24%{transform:translateX(0)}
 30%,57%{transform:translateX(-25%)}
 63%,90%{transform:translateX(-50%)}
 96%,100%{transform:translateX(-75%)}
}
@media(prefers-reduced-motion:reduce){
 .ticker-mobile-track{animation:none;width:100%;flex-direction:column;gap:12px}
 .ticker-slide{width:100%}
 .ticker-slide[aria-hidden=true]{display:none}
}
</style></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
